<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Orders · Cake'd By Mone'T</title>
  <meta name="theme-color" content="#0a0610" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Pacifico&family=Yellowtail&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    main { max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 4rem; display: grid; gap: 1.2rem; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .top img { width: 150px; }
    .top h1 { font-family: var(--hand); font-weight: 400; font-size: 2.2rem; color: var(--pink-hot); }
    .form h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); margin-bottom: .8rem; }
    .filters { display: flex; gap: .4rem; flex-wrap: wrap; }
    .filters button { font: 700 .85rem var(--sans); color: #fff; background: transparent; border: 1.5px solid #4a2a5c; border-radius: 999px; padding: .4rem .9rem; cursor: pointer; }
    .filters button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); }
    .list { display: grid; gap: .7rem; }
    .item { display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; text-decoration: none; background: var(--bg-2); border: 1.5px solid #4a2a5c; border-radius: 16px; padding: .9rem 1.1rem; }
    .item:hover { border-color: var(--pink); }
    .item b { font-size: 1.05rem; }
    .item small { color: var(--muted); grid-column: 1 / -1; white-space: pre-line; }
    .pill { justify-self: end; align-self: start; font-weight: 800; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; border-radius: 999px; padding: .2rem .7rem; color: #111; background: var(--muted); white-space: nowrap; }
    .pill.received { background: var(--yellow); }
    .pill.pending { background: var(--orange); }
    .pill.confirmed { background: var(--lime); }
    .pill.declined { background: #6b5a75; color: #fff; }
    .pill.rush { background: var(--yellow); margin-left: .4rem; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1rem; }
    dt { color: var(--muted); font-weight: 700; }
    dd { font-weight: 700; overflow-wrap: anywhere; white-space: pre-line; }
    dd a { color: var(--cyan); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid2 label, .stack label { display: flex; flex-direction: column; gap: .35rem; font-weight: 700; font-size: .9rem; }
    .stack { display: grid; gap: 1rem; }
    .check { flex-direction: row !important; align-items: center; gap: .6rem !important; }
    .form .check input { width: 1.2rem; height: 1.2rem; accent-color: var(--pink); }
    .money-row { display: flex; justify-content: space-between; font-weight: 700; }
    .money-row strong { color: var(--lime); font-size: 1.3rem; }
    .row { display: flex; gap: .6rem; flex-wrap: wrap; }
    .row .btn { flex: 1 1 180px; }
    .tracker { display: flex; gap: .4rem; flex-wrap: wrap; }
    .tracker span { font-weight: 800; font-size: .78rem; text-transform: uppercase; border-radius: 999px; padding: .25rem .8rem; border: 1.5px solid #4a2a5c; color: var(--muted); }
    .tracker .done { border-color: var(--lime); color: var(--lime); }
    .tracker .now { background: var(--pink); border-color: var(--pink); color: #fff; }
    .sent { background: rgba(125,255,58,.08); border: 1.5px solid var(--lime); border-radius: 16px; padding: 1rem; display: grid; gap: .6rem; }
    .sent textarea { min-height: 8rem; font: inherit; font-size: .95rem; padding: .7rem .9rem; border: 1.5px solid #4a2a5c; border-radius: 12px; background: #0d0714; color: #fff; width: 100%; }
    .hint { color: var(--muted); font-size: .85rem; }
    .err { color: var(--yellow); font-weight: 700; text-align: center; }
    .decline { border-color: #4a2a5c; box-shadow: none; }
    .btn-dim { background: transparent; border-color: #8a6a9c; box-shadow: none; }
    .back { color: var(--cyan); font-weight: 700; text-decoration: none; }
    @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .top img { width: 110px; } }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <a href="orders.html"><img src="assets/logo.png" alt="Cake'd by Mone'T" /></a>
      <h1>Orders</h1>
    </header>
    <div id="app"><p class="hint">Loading…</p></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="menu.js"></script>
  <script>
    const app = $("#app");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const num = (s) => Number(String(s || "").replace(/[^0-9.]/g, "")) || 0;
    const STEPS = ["Received", "Pending Payment", "Confirmed"];
    const pillClass = { Received: "received", "Pending Payment": "pending", Confirmed: "confirmed", Declined: "declined" };
    const pill = (s) => `<span class="pill ${pillClass[s] || ""}">${esc(s)}</span>`;
    let key = "";
    try { key = localStorage.getItem("caked-admin-key") || ""; } catch {}
    let filter = "Active";
    let lastText = {}; // text message to offer after an action, by order id

    const api = {
      get: (params) => fetch(`${CONFIG.ordersApi}?${new URLSearchParams({ ...params, key })}`).then((r) => r.json()),
      post: (body) => fetch(CONFIG.ordersApi, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, key }) }).then((r) => r.json()),
    };

    function keyGate(error = "") {
      app.innerHTML = `<form class="form stack" id="keyForm">
        <h2>Sign in</h2>
        <p class="hint">Paste the dashboard key from the Apps Script setup. This phone will remember it.</p>
        <input id="keyInput" autocomplete="off" placeholder="Dashboard key" />
        <button class="btn" type="submit">Open orders</button>
        ${error ? `<p class="err">${esc(error)}</p>` : ""}
      </form>`;
      $("#keyForm").addEventListener("submit", (e) => {
        e.preventDefault();
        key = $("#keyInput").value.trim();
        try { localStorage.setItem("caked-admin-key", key); } catch {}
        route();
      });
    }

    async function route() {
      if (!CONFIG.ordersApi) { app.innerHTML = `<p class="form err">The order system isn't connected yet. Add the Apps Script URL to <b>ordersApi</b> in menu.js (see apps-script/SETUP.md).</p>`; return; }
      if (!key) return keyGate();
      const id = decodeURIComponent(location.hash.slice(1));
      app.innerHTML = `<p class="hint">Loading…</p>`;
      try {
        const out = id ? await api.get({ action: "get", id }) : await api.get({ action: "list" });
        if (!out.ok) {
          if (/key/i.test(out.error)) { try { localStorage.removeItem("caked-admin-key"); } catch {} key = ""; return keyGate(out.error); }
          throw new Error(out.error);
        }
        id ? detail(out.order) : list(out.orders);
      } catch (err) {
        app.innerHTML = `<p class="form err">Couldn't load orders: ${esc(err.message)}</p>`;
      }
    }
    window.addEventListener("hashchange", route);

    // ----- List -----
    function list(orders) {
      const today = new Date().toISOString().slice(0, 10);
      const groups = {
        Active: (o) => o.Status !== "Declined" && (o.Status !== "Confirmed" || o["Pickup Date"] >= today),
        Received: (o) => o.Status === "Received",
        "Pending Payment": (o) => o.Status === "Pending Payment",
        Confirmed: (o) => o.Status === "Confirmed",
        Declined: (o) => o.Status === "Declined",
        All: () => true,
      };
      const shown = orders.filter(groups[filter]).sort((a, b) => filter === "All" || filter === "Declined"
        ? b.Created.localeCompare(a.Created) : a["Pickup Date"].localeCompare(b["Pickup Date"]));
      const count = (g) => orders.filter(groups[g]).length;
      app.innerHTML = `<div class="filters">${Object.keys(groups).map((g) =>
          `<button type="button" data-f="${g}" aria-pressed="${g === filter}">${g} (${count(g)})</button>`).join("")}</div>
        <div class="list" style="margin-top:1rem">${shown.map((o) => `
          <a class="item" href="#${esc(o.ID)}">
            <b>${esc(o.Name)}${o.Rush ? `<span class="pill rush">Rush</span>` : ""}</b>${pill(o.Status)}
            <small>${esc(o.dateText)}${o["Pickup Time"] ? ` at ${esc(o["Pickup Time"])}` : ""} · ${esc(o.Total || `est. ${o.Estimate}`)} · ${esc(o.ID)}\n${esc(o.Items)}</small>
          </a>`).join("") || `<p class="hint">No orders here.</p>`}</div>`;
      app.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; list(orders); }));
    }

    // ----- One order -----
    function detail(o) {
      const step = STEPS.indexOf(o.Status);
      const phone = o.Phone.replace(/[^\d+]/g, "");
      app.innerHTML = `
        <a class="back" href="#">← All orders</a>
        <section class="form stack">
          <div class="tracker">${o.Status === "Declined" ? `<span class="now">Declined</span>`
            : STEPS.map((s, i) => `<span class="${i < step ? "done" : i === step ? "now" : ""}">${i < step ? "✓ " : ""}${s}</span>`).join("")}</div>
          ${o.Rush ? `<p class="rush-flag notice rush">Rush order: under ${CONFIG.noticeDays} days' notice</p>` : ""}
          <dl>
            <dt>Order #</dt><dd>${esc(o.ID)}</dd>
            <dt>Name</dt><dd>${esc(o.Name)}</dd>
            <dt>Phone</dt><dd><a href="tel:${esc(phone)}">${esc(o.Phone)}</a></dd>
            <dt>Email</dt><dd><a href="mailto:${esc(o.Email)}">${esc(o.Email)}</a></dd>
            <dt>Pickup</dt><dd>${esc(o.dateText)}${o["Pickup Time"] ? ` at ${esc(o["Pickup Time"])}` : ""}</dd>
            <dt>Items</dt><dd>${esc(o.Items)}</dd>
            ${o.Notes ? `<dt>Notes</dt><dd>${esc(o.Notes)}</dd>` : ""}
            <dt>Menu estimate</dt><dd>${esc(o.Estimate)}</dd>
            ${o.Total ? `<dt>Total</dt><dd>${esc(o.Total)}${o["Rush Fee"] ? ` (incl. ${esc(o["Rush Fee"])} rush fee)` : ""}</dd>
              <dt>Payment</dt><dd>${esc(o["Payment Type"])}: ${esc(o["Amount Due"])} due${num(o["Balance At Pickup"]) > 0 && o.Status !== "Confirmed" ? `, ${esc(o["Balance At Pickup"])} at pickup` : ""}</dd>` : ""}
            ${o["Amount Paid"] ? `<dt>Paid</dt><dd>${esc(o["Amount Paid"])} via ${esc(o["Payment Method"] || "?")} · ${esc(o["Paid At"])}</dd>
              <dt>Due at pickup</dt><dd>${num(o["Balance At Pickup"]) > 0 ? esc(o["Balance At Pickup"]) : "Nothing, paid in full"}</dd>` : ""}
          </dl>
        </section>
        <div id="sentBox"></div>
        <div id="actions"></div>`;

      if (lastText[o.ID]) showText(o, lastText[o.ID]);
      const actions = $("#actions");
      if (o.Status === "Received") paymentForm(o, actions);
      if (o.Status === "Pending Payment") verifyForm(o, actions);
      if (o.Status === "Confirmed") {
        actions.innerHTML = `<section class="form stack"><h2>Confirmed</h2>
          <p>Confirmation email: <b>${o["Confirmation Sent"] ? `sent ${esc(o["Confirmation Sent"])}` : "not sent (email failed). Text them instead."}</b></p>
          <p>Pickup reminder: <b>${o["Reminder Sent"] ? `sent ${esc(o["Reminder Sent"])}` : "goes out automatically the day before pickup"}</b></p>
          <a class="btn btn-ghost" href="sms:${esc(phone)}">Text ${esc(o.Name.split(" ")[0])}</a></section>`;
      }
      if (o.Status === "Received" || o.Status === "Pending Payment") declineForm(o, actions);
    }

    // Step 1 -> 2: set the price and send the payment request
    function paymentForm(o, box) {
      const sec = document.createElement("section");
      sec.className = "form stack";
      sec.innerHTML = `<h2>${o.Status === "Received" ? "Send payment request" : "Change price & resend"}</h2>
        <div class="grid2">
          <label>Order price ($)<input id="price" type="number" min="0" step="0.01" value="${num(o.Total) - num(o["Rush Fee"]) || num(o.Estimate)}" /></label>
          ${o.Rush ? `<label>Rush fee ($)<input id="fee" type="number" min="0" step="0.01" value="${num(o["Rush Fee"])}" /></label>` : ""}
        </div>
        <label class="check"><input type="checkbox" id="custom" ${o.Custom ? "checked" : ""} /> Custom order (always ${CONFIG.depositPercent}% deposit)</label>
        <div>
          <div class="money-row"><span>Total</span><span id="mTotal"></span></div>
          <div class="money-row"><span id="mType"></span><strong id="mDue"></strong></div>
          <div class="money-row"><span>Balance at pickup</span><span id="mBal"></span></div>
        </div>
        <label>Payment link (Stripe)
          <input id="link" type="url" placeholder="https://buy.stripe.com/…" value="${esc(o["Payment Link"])}" />
        </label>
        <p class="hint">Make a Stripe payment link for the "due now" amount, then paste it above.</p>
        <div class="row">
          <a class="btn btn-ghost" href="https://dashboard.stripe.com/payment-links/create" target="_blank" rel="noopener">Open Stripe ↗</a>
          <button class="btn btn-ghost" type="button" id="copyDesc">Copy description</button>
        </div>
        <button class="btn" type="button" id="sendPay">Email payment request ♡</button>
        <p class="hint">Status becomes <b>Pending Payment</b>. The order is not confirmed until you verify the payment.</p>`;
      box.append(sec);
      const calc = () => {
        const fee = o.Rush ? Math.max(0, +$("#fee").value || 0) : 0;
        const total = Math.max(0, +$("#price").value || 0) + fee;
        return { total, fee, plan: paymentPlan(total, $("#custom").checked) };
      };
      const refresh = () => {
        const { total, plan } = calc();
        $("#mTotal").textContent = cents(total);
        $("#mType").textContent = plan.deposit ? `Due now (${CONFIG.depositPercent}% deposit)` : "Due now (paid in full)";
        $("#mDue").textContent = cents(plan.due);
        $("#mBal").textContent = cents(plan.balance);
      };
      sec.addEventListener("input", refresh);
      refresh();
      $("#copyDesc").addEventListener("click", async () => {
        const { plan } = calc();
        const text = `${plan.deposit ? `${CONFIG.depositPercent}% deposit` : "Payment in full"} for order ${o.ID} (${o.Name}), pickup ${o.dateText}: ${cents(plan.due)}`;
        try { await navigator.clipboard.writeText(text); toast("Copied ♡"); } catch { toast(text); }
      });
      $("#sendPay").addEventListener("click", () => act($("#sendPay"), {
        action: "requestPayment", id: o.ID, total: +$("#price").value || 0, rushFee: o.Rush ? +$("#fee").value || 0 : 0,
        custom: $("#custom").checked, payLink: $("#link").value.trim(),
      }));
    }

    // Step 2 -> 3: she checks Stripe / Cash App, then confirms
    function verifyForm(o, box) {
      const sec = document.createElement("section");
      sec.className = "form stack";
      sec.innerHTML = `<h2>Verify payment</h2>
        <p>Waiting on <b>${esc(o["Amount Due"])}</b> (${esc(o["Payment Type"])}). Requested ${esc(o["Payment Requested At"])}.</p>
        <p class="hint">Check that the money actually arrived before confirming.</p>
        <div class="row">
          <a class="btn btn-ghost" href="https://dashboard.stripe.com/payments" target="_blank" rel="noopener">Check Stripe ↗</a>
          ${o["Payment Link"] ? `<button class="btn btn-ghost" type="button" id="copyLink">Copy payment link</button>` : ""}
        </div>
        <div class="grid2">
          <label>Amount received ($)<input id="amount" type="number" min="0" step="0.01" value="${num(o["Amount Due"])}" /></label>
          <label>Paid with<select id="method">
            <option>Card (Stripe)</option><option>Apple Pay (Stripe)</option><option>Cash App</option><option>Cash</option><option>Other</option>
          </select></label>
        </div>
        <button class="btn" type="button" id="markPaid">Payment verified: confirm order ♡</button>
        <p class="hint">Sends the confirmation email with the order details, payment status and pickup info. The pickup reminder then goes out automatically the day before.</p>
        <details><summary class="hint" style="cursor:pointer">Change the price or payment link</summary><div id="resend"></div></details>`;
      box.append(sec);
      paymentForm(o, $("#resend"));
      $("#copyLink")?.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(o["Payment Link"]); toast("Copied ♡"); } catch { toast(o["Payment Link"]); }
      });
      $("#markPaid").addEventListener("click", () => {
        const amount = +$("#amount").value || 0;
        if (amount < num(o["Amount Due"]) && !confirm(`${cents(amount)} is less than the ${o["Amount Due"]} due. Confirm anyway?`)) return;
        act($("#markPaid"), { action: "markPaid", id: o.ID, amount, method: $("#method").value });
      });
    }

    function declineForm(o, box) {
      const sec = document.createElement("section");
      sec.className = "form stack decline";
      sec.innerHTML = `<h2>Or decline</h2>
        <textarea id="declineMsg" rows="4">Thank you so much for your order request! Unfortunately I'm not able to take this one for ${esc(o.dateText)}. I'd love to bake for you another time ♡ Mone'T</textarea>
        <button class="btn btn-dim" type="button" id="declineBtn">Email decline</button>`;
      box.append(sec);
      $("#declineBtn").addEventListener("click", () => {
        if (!confirm(`Decline ${o.Name}'s order?`)) return;
        act($("#declineBtn"), { action: "decline", id: o.ID, message: $("#declineMsg").value });
      });
    }

    async function act(button, body) {
      button.disabled = true;
      const label = button.textContent;
      button.textContent = "Working…";
      try {
        const out = await api.post(body);
        if (!out.ok) throw new Error(out.error);
        lastText[out.order.ID] = out.text;
        toast("Done ♡ Email sent");
        detail(out.order);
        scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        toast(err.message);
        button.disabled = false;
        button.textContent = label;
      }
    }

    // After an action: the same message ready to text
    function showText(o, text) {
      const phone = o.Phone.replace(/[^\d+]/g, "");
      $("#sentBox").innerHTML = `<div class="sent"><b>✓ Emailed to ${esc(o.Email)}. Want to text it too?</b>
        <textarea id="smsText">${esc(text)}</textarea>
        <div class="row"><a class="btn" id="smsBtn" href="#">Text ${esc(o.Name.split(" ")[0])} ♡</a></div></div>`;
      $("#smsBtn").addEventListener("click", (e) => {
        e.preventDefault();
        location.href = `sms:${phone}?&body=${encodeURIComponent($("#smsText").value)}`;
      });
    }

    let toastTimer;
    function toast(t) {
      const el = $("#toast");
      el.textContent = t;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    route();
  </script>
</body>
</html>
